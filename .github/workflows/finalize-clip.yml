name: Finalize clip (manual test)

on:
  workflow_dispatch:
    inputs:
      clip_id:
        description: "ID klip dari tabel 'clips' di Supabase"
        required: true
        type: string

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: worker/requirements.txt

      - name: Install ffmpeg & font
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependency Python
        run: pip install -r worker/requirements.txt

      - name: Jalankan finalize
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python finalize_clip.py "${{ inputs.clip_id }}"
